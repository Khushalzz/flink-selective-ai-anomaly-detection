services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: bdt-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  redis:
    image: redis:7-alpine
    container_name: bdt-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: bdt-clickhouse
    hostname: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

  mongodb:
    image: mongo:7.0
    container_name: bdt-mongodb
    hostname: mongodb
    profiles: ["legacy"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: vead_experiments
    volumes:
      - mongo_data:/data/db

  jobmanager:
    image: flink:1.20.2-scala_2.12-java17
    container_name: bdt-flink-jobmanager
    hostname: jobmanager
    command: jobmanager
    depends_on:
      checkpoint-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        parallelism.default: 4
        jobmanager.memory.process.size: 1024m
    volumes:
      - ./flink-job/target:/opt/flink/usrlib
      - .:/workspace
      - flink_checkpoints:/opt/flink/checkpoints

  taskmanager:
    image: flink:1.20.2-scala_2.12-java17
    container_name: bdt-flink-taskmanager
    hostname: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/checkpoints
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1536m
        parallelism.default: 4
    volumes:
      - ./flink-job/target:/opt/flink/usrlib
      - .:/workspace
      - flink_checkpoints:/opt/flink/checkpoints

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: bdt-dashboard
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLINK_REST_URL: http://jobmanager:8081
      SCHEMA_PATH: /app/init.sql
      ASSET_DIR: /app/assets
    volumes:
      - ./assets:/app/assets:ro
      - ./docker/clickhouse/init.sql:/app/init.sql:ro
    depends_on:
      - redis
      - clickhouse
      - jobmanager

  flink-builder:
    image: maven:3.9.9-eclipse-temurin-17
    profiles: ["tools"]
    working_dir: /workspace/flink-job
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: ["mvn", "package"]

  checkpoint-init:
    image: flink:1.20.2-scala_2.12-java17
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 9999:9999 /opt/flink/checkpoints"]
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints

  producer:
    build:
      context: ./docker/demo
      dockerfile: Dockerfile
    profiles: ["demo"]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    depends_on:
      - kafka
      - redis

  laya-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    profiles: ["laya"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENABLE_LAYA_MODEL: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      USE_TF: "0"
    volumes:
      - ./models:/app/models:ro

volumes:
  mongo_data:
  flink_checkpoints:
  maven_cache:
